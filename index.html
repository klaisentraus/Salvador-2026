* { box-sizing: border-box; }
/* Tela travada no celular: sem pinça, sem duplo toque e sem a página inteira balançar. Só as áreas internas rolam. */
html, body { height: 100%; margin: 0; overscroll-behavior: none; }
html { touch-action: pan-x pan-y; }
body { position: fixed; inset: 0; }
button, a, input, select, textarea { touch-action: manipulation; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; -webkit-text-size-adjust: 100%; overflow: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; max-width: 760px; margin: 0 auto; }
header.top { position: relative; overflow: hidden; isolation: isolate; background: var(--ocean); color: var(--on-ocean); padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 52px; display: flex; align-items: center; gap: 10px; }
#sky { position: absolute; left: 0; top: 0; z-index: -1; pointer-events: none; image-rendering: pixelated; image-rendering: crisp-edges; }
.brand { flex: 1; min-width: 0; }
.brand h1 { font-family: var(--f-pixel); font-weight: 700; font-size: 25px; margin: 0; letter-spacing: .01em; line-height: 1.05; text-shadow: 2px 2px 0 rgba(0,0,0,.35); }
@media (max-width: 385px) { .brand h1 { font-size: 21px; } }
@media (max-width: 365px) { .brand h1 { font-size: 18px; } .seg button { padding: 5px 8px; } .tbtn { padding: 6px 9px; } }
.brand p { margin: 2px 0 0; font-size: 12px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbtn { background: rgba(6,20,30,.35); border: 1px solid rgba(255,255,255,.3); color: var(--on-ocean); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.seg { display: inline-flex; background: rgba(6,20,30,.35); border-radius: 999px; padding: 2px; border: 1px solid rgba(255,255,255,.3); }
.seg button { background: none; border: 0; color: var(--on-ocean); padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; opacity: .75; }
.seg button[aria-pressed="true"] { background: var(--on-ocean); color: var(--ocean); opacity: 1; }

.days { display: flex; gap: 5px; overflow-x: auto; overscroll-behavior: contain; padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--line); scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.daychip { flex: 1 1 0; min-width: 0; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 5px 2px 6px; text-align: center; transition: border-color .15s, background .15s, opacity .15s; }
.daychip .wd { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.daychip .dn { font-family: var(--f-display); font-weight: 700; font-size: 20px; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.daychip[aria-current="true"] { background: var(--ocean); border-color: var(--ocean); color: var(--on-ocean); }
.daychip[aria-current="true"] .wd { color: var(--on-ocean); opacity: .8; }
.daychip.drop-ok { border-color: var(--ok); background: var(--okfill); color: var(--ink); }
.daychip.drop-bad { opacity: .35; }
.daychip.drop-hover { outline: 3px solid var(--ok); outline-offset: 1px; }

main { position: relative; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.dayinfo { padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--bg); }
.dayinfo strong { color: var(--ink); font-family: var(--f-display); font-size: 17px; font-weight: 700; font-variant-numeric: lining-nums; }
.dayinfo .note { color: var(--accent); font-weight: 600; }
.dayinfo .suninfo { color: var(--sun); font-weight: 700; }
.scroller { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; position: relative; }
.tlwrap { position: relative; padding: 8px 16px 24px 52px; }
.tl { position: relative; }
.hr { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
.hr.half { border-top-style: dashed; opacity: .55; }
.hlabel { position: absolute; left: -44px; width: 36px; text-align: right; font-size: 11.5px; color: var(--muted); transform: translateY(-8px); font-variant-numeric: tabular-nums; }
.blocked { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, var(--stripe) 0 6px, transparent 6px 12px); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); }
.sunline { position: absolute; left: -8px; right: 0; border-top: 2px dashed var(--sun); pointer-events: none; z-index: 3; }
.sunline span, .tideline span { position: absolute; right: 0; top: -9px; background: var(--bg); padding: 0 6px; font-size: 11px; font-weight: 600; border-radius: 6px; }
.sunmark { position: absolute; left: -50px; width: 42px; white-space: nowrap; text-align: right; font-size: 10.5px; font-weight: 700; color: var(--sun); transform: translateY(-7px); z-index: 5; font-variant-numeric: tabular-nums; }
.sunline span { color: var(--sun); }
.tideline { position: absolute; left: -8px; right: 0; border-top: 1px dotted var(--b-mar); pointer-events: none; z-index: 3; opacity: .8; }
.tideline span { color: var(--b-mar); right: auto; left: 12px; }
.now-hint { font-size: 12px; color: var(--muted); padding: 0 16px 14px 52px; }

.band { position: absolute; left: -4px; right: -4px; border-radius: 8px; pointer-events: none; z-index: 1; }
.band.ok { background: var(--okfill); outline: 1.5px solid var(--ok); }
.dragshade { position: absolute; inset: 0; background: repeating-linear-gradient(135deg, var(--badfill) 0 8px, transparent 8px 16px); pointer-events: none; z-index: 1; border-radius: 8px; }

.blk { position: absolute; border-radius: 10px; border: 1.5px solid var(--b); background: var(--c); color: var(--ink); padding: 4px 8px 10px; overflow: hidden; z-index: 4; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y; transition: box-shadow .15s, transform .15s; display: flex; flex-direction: column; }
.blk .t { font-weight: 700; font-size: 13.5px; line-height: 17px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--lines, 1); overflow: hidden; flex: 0 0 auto; }
.blk .m, .blk .m2 { font-size: 11.5px; line-height: 15.5px; color: var(--muted); font-variant-numeric: tabular-nums; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 0 auto; }
.blk .m2 { color: var(--ink); opacity: .8; }
.blk .brief { font-size: 12px; line-height: 16px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--lines, 1); overflow: hidden; flex: 0 0 auto; }
.blk .tags { display: flex; gap: 4px; overflow: hidden; margin-top: 3px; flex: 0 0 auto; }
.blk.tiny { padding-top: 2px; padding-bottom: 2px; justify-content: center; }
.blk.tiny .t { font-size: 12px; line-height: 15px; white-space: nowrap; display: block; text-overflow: ellipsis; }
.blk.tiny .t small { font-weight: 600; color: var(--muted); font-size: 11px; }
.blk.locked, .blk.pinned { border-style: dashed; }
.blk.conflict { box-shadow: 0 0 0 2px var(--bad); }
.blk.bad { border-color: var(--bad); border-style: dashed; border-width: 2px; }
.blk .warn { font-size: 10.5px; font-weight: 700; color: var(--bad); text-transform: uppercase; letter-spacing: .04em; }
.tagp { display: inline-block; font-size: 10.5px; font-weight: 700; line-height: 15px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--b); color: var(--ink); white-space: nowrap; background: var(--surface); }
.blk.dragging { z-index: 40; box-shadow: 0 10px 28px rgba(0,0,0,.25); transform: scale(1.02); touch-action: none; }
.blk.invalid { border-color: var(--bad); border-width: 2.5px; }
.blk .grip { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; touch-action: none; cursor: ns-resize; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 3px; }
.blk .grip::after { content: ""; width: 28px; height: 3px; border-radius: 2px; background: var(--b); opacity: .55; }
.blk.locked .grip { display: none; }
.dragtip { position: absolute; z-index: 60; left: 0; right: 0; pointer-events: none; display: flex; justify-content: center; }
.dragtip span { background: var(--ink); color: var(--bg); font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.dragtip.bad span { background: var(--bad); color: #fff; }

/* Semana */
.weekscroll { overflow-x: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.week { display: grid; grid-template-columns: 26px repeat(7, minmax(88px, 1fr)); gap: 0 4px; padding: 8px 12px 12px 6px; min-width: 670px; }
.week .wh { text-align: center; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; padding-bottom: 4px; }
.week .wh b { display: block; font-family: var(--f-display); font-weight: 700; font-variant-numeric: lining-nums; font-size: 18px; color: var(--ink); text-transform: none; }
.week .wcol { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; padding: 0; }
.week .wlab { position: relative; }
.week .wlab span { position: absolute; right: 2px; font-size: 10px; color: var(--muted); transform: translateY(-6px); }
.wblk { position: absolute; left: 1px; right: 1px; border-radius: 5px; background: var(--c); border: 1px solid var(--b); font-size: 10.5px; line-height: 1.15; padding: 2px 4px; overflow: hidden; color: var(--ink); font-weight: 600; hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word; text-align: left; }
.wblk.conflict { outline: 1.5px solid var(--bad); }
.wsun { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--sun); z-index: 2; pointer-events: none; }
.wblocked { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, var(--stripe) 0 4px, transparent 4px 8px); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 0 16px 20px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); border: 1.5px solid var(--b); margin-right: 5px; vertical-align: -1px; }

/* Barra inferior */
.bottom { position: relative; z-index: 10; background-color: var(--sand); background-image: var(--grain); background-size: 12px 12px; padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 10px); display: flex; gap: 8px; }
.bottom::before { content: ""; position: absolute; left: 0; right: 0; top: -10px; height: 10px; background-image: var(--wave); background-size: 48px 10px; background-repeat: repeat-x; image-rendering: pixelated; pointer-events: none; animation: tide 3.2s steps(24) infinite; }
@keyframes tide { to { background-position-x: -48px; } }
.bbtn { flex: 1; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); padding: 10px 6px; font-weight: 700; font-size: 14px; }
.bbtn.helena { background: var(--c-helena); border-color: var(--b-helena); }
.bbtn.primary { background: var(--ocean); color: var(--on-ocean); border-color: var(--ocean); }
.bbtn:disabled { opacity: .4; }

/* Painel inferior (sheet) */
.scrim { position: fixed; inset: 0; background: rgba(5,16,20,.45); z-index: 80; opacity: 0; transition: opacity .2s; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 90; max-width: 760px; margin: 0 auto; background: var(--surface); border-radius: 18px 18px 0 0; max-height: 88%; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .22s ease-out; box-shadow: 0 -8px 30px rgba(0,0,0,.18); }
.sheet.on { transform: none; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 0; flex: 0 0 auto; }

.edit { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 12px; }

.dpick { display: flex; flex-wrap: wrap; gap: 6px; }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
select, input[type=text], textarea { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; font-size: 16px; max-width: 100%; }
textarea { width: 100%; min-height: 70px; }

.hint { font-size: 12.5px; color: var(--muted); margin: 0; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
